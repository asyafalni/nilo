# The documentation site, published when a release is tagged and at no other
# time, so the site never shows what is still under `## Unreleased`.
#
# One copy per minor release: v0.6.0 and v0.6.1 both land in `0.6`, because a
# patch does not change what the guide teaches. `latest` moves only when the
# tag is the newest one, so a v0.5.1 cut after v0.6.0 updates `0.5` and leaves
# the front page alone. mike keeps every copy on the `gh-pages` branch, which
# is what Settings → Pages serves from.
#
# workflow_dispatch re-publishes an existing tag, for a deploy that failed. A
# tag older than mkdocs.yml has no site to build.

name: Docs

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to publish, e.g. v0.6.0'
        required: true

permissions:
  contents: write

# Two tags pushed together must not race each other to gh-pages.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # mike commits onto gh-pages, and `latest` needs every tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - run: pip install -r docs/site/requirements.txt

      - name: Publish
        env:
          NILO_DOCS_REF: ${{ env.TAG }} # links out of the guide open the file as it was at this tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          version=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/')
          newest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)

          if [ "$TAG" = "$newest" ]; then
            mike deploy --push --update-aliases "$version" latest
            mike set-default --push latest
          else
            mike deploy --push "$version"
          fi
