# The one place the Zig a workflow uses is pinned, for every job that builds.
#
# Downloaded and checksummed rather than installed by a third-party action:
# one fewer thing to trust, and the version is the same
# `minimum_zig_version` that build.zig.zon names. It used to be pinned in
# each workflow; a second workflow that builds (release-numbers.yml) made two
# copies of a version and its checksums that could drift apart.

name: Zig
description: Install the pinned Zig and restore its global cache.

runs:
  using: composite
  steps:
    - name: Install Zig
      shell: bash
      run: |
        set -euo pipefail
        version=0.17.0
        ext=tar.xz
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            name=zig-x86_64-linux-$version
            sum=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 ;;
          Linux-ARM64)
            name=zig-aarch64-linux-$version
            sum=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8 ;;
          macOS-ARM64)
            name=zig-aarch64-macos-$version
            sum=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a ;;
          Windows-X64)
            name=zig-x86_64-windows-$version
            ext=zip
            sum=b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428 ;;
          *)
            echo "no Zig is pinned for $RUNNER_OS-$RUNNER_ARCH" >&2
            exit 1 ;;
        esac
        curl -fsSL --retry 3 -o "zig.$ext" "https://ziglang.org/download/$version/$name.$ext"
        echo "$sum  zig.$ext" | shasum -a 256 -c -
        mkdir -p "$HOME/zig"
        if [ "$ext" = zip ]; then
          # Windows ships a zip, which Git Bash's tar cannot read.
          unzip -q zig.zip -d "$HOME/zig-unpacked"
          mv "$HOME/zig-unpacked/$name"/* "$HOME/zig/"
        else
          tar -xf "zig.$ext" -C "$HOME/zig" --strip-components=1
        fi
        rm "zig.$ext"
        # GITHUB_PATH wants the runner's own path form, which on Windows is not
        # Git Bash's /c/... one.
        if command -v cygpath >/dev/null; then cygpath -w "$HOME/zig"; else echo "$HOME/zig"; fi >> "$GITHUB_PATH"
        echo "ZIG_VERSION=$version" >> "$GITHUB_ENV"

    - name: Cache Zig's global cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/zig
        key: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
        restore-keys: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-

    - shell: bash
      run: zig version
